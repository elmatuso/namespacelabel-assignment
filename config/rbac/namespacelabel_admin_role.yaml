apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: namespacelabel-assignment
    app.kubernetes.io/managed-by: kustomize
  name: namespacelabel-admin-role
rules:
- apiGroups:
  - namespacelabel.dana.io
  resources:
  - namespacelabels
  verbs:
  - '*'
- apiGroups:
  - namespacelabel.dana.io
  resources:
  - namespacelabels/status
  verbs:
  - get
