# This rule is not used by the project namespacelabel-assignment itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over namespacelabel.dana.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: namespacelabel-assignment
    app.kubernetes.io/managed-by: kustomize
  name: namespacelabel-admin-role
rules:
- apiGroups:
  - namespacelabel.dana.io
  resources:
  - namespacelabels
  verbs:
  - '*'
- apiGroups:
  - namespacelabel.dana.io
  resources:
  - namespacelabels/status
  verbs:
  - get
