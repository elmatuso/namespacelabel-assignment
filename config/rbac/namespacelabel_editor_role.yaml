# This rule is not used by the project namespacelabel-assignment itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the namespacelabel.dana.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: namespacelabel-assignment
    app.kubernetes.io/managed-by: kustomize
  name: namespacelabel-editor-role
rules:
- apiGroups:
  - namespacelabel.dana.io
  resources:
  - namespacelabels
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - namespacelabel.dana.io
  resources:
  - namespacelabels/status
  verbs:
  - get
